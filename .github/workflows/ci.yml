name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.9.5"

jobs:
  backend:
    name: Backend · lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest with coverage
        run: |
          pytest -q --cov=app --cov-report=term --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/junit.xml
            backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend · typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7

  terraform:
    name: Terraform · format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Validate dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Validate prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  ansible:
    name: Ansible · structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Static validation (roles, includes, templates, inventories)
        run: python scripts/validate_ansible.py

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install ansible-lint
        run: pip install "ansible-lint==24.7.0"

      - name: ansible-lint (advisory)
        working-directory: ansible
        continue-on-error: true
        run: ansible-lint

  security:
    name: Security · secret and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov (advisory baseline)
        continue-on-error: true
        run: |
          checkov --directory terraform --quiet --compact \
            --framework terraform --output cli

  validation-summary:
    name: Validation summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, terraform, ansible]
    if: always()
    steps:
      - name: Report job outcomes
        run: |
          echo "### CI results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | ${{ needs.backend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${{ needs.frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform | ${{ needs.terraform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ansible | ${{ needs.ansible.result }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.terraform.result }}" != "success" ] || \
             [ "${{ needs.ansible.result }}" != "success" ]; then
            echo "One or more required checks failed." >&2
            exit 1
          fi
