---
# Shared variables for the dev environment.
project_name: hccp
environment_name: dev
domain_name: dev.hccp.internal
timezone: Asia/Kolkata
ntp_servers:
  - 169.254.169.123
  - time.aws.com

# Local break-glass accounts. Keys must be provided via Vault or --extra-vars.
admin_users:
  - name: platform-admin
    comment: Platform engineering break-glass account
    groups: [wheel, sudo]
    shell: /bin/bash
    sudo_nopasswd: false
    ssh_key: "{{ lookup('env', 'HCCP_ADMIN_SSH_KEY') | default('', true) }}"
  - name: deploy-bot
    comment: CI deployment account (command restricted)
    groups: [deployers]
    shell: /bin/bash
    sudo_nopasswd: true
    ssh_key: "{{ lookup('env', 'HCCP_DEPLOY_SSH_KEY') | default('', true) }}"

# Keep the cloud-init user until break-glass access is verified.
removed_users: []

# Package baselines
baseline_packages:
  - curl
  - unzip
  - tar
  - vim-enhanced
  - jq
  - git
  - chrony
  - audit
  - rsyslog

security_packages:
  - aide
  - aide-common

# Patching
patch_reboot: true
patch_reboot_timeout: 900

# Application
app_name: hccp-web
app_port: 8080
app_health_path: /healthz
app_release_version: "1.0.0"
