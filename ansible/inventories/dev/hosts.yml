---
# Static development inventory.
# Addresses match terraform/environments/dev outputs (instance_private_ips).
# Replace them with `terraform output -json instance_private_ips` when running
# against a real account, or switch to inventories/aws_ec2.yml.
all:
  vars:
    target_env: dev
    ansible_python_interpreter: /usr/bin/python3
  children:
    linux:
      vars:
        ansible_user: ec2-user
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      hosts:
        hccp-dev-web-01:
          ansible_host: 10.20.16.11
        hccp-dev-web-02:
          ansible_host: 10.20.16.12
        hccp-dev-app-01:
          ansible_host: 10.20.16.13
    windows:
      vars:
        ansible_user: Administrator
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
      hosts:
        hccp-dev-win-01:
          ansible_host: 10.20.16.14
