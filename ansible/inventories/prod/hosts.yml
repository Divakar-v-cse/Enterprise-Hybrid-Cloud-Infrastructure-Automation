---
# Production inventory. RDP/SSH is not exposed: use SSM Session Manager or a
# bastion host with the same private addressing.
all:
  vars:
    target_env: prod
    ansible_python_interpreter: /usr/bin/python3
  children:
    linux:
      vars:
        ansible_user: ec2-user
        ansible_ssh_common_args: "-o StrictHostKeyChecking=yes"
      hosts:
        hccp-prod-web-01:
          ansible_host: 10.10.16.11
        hccp-prod-web-02:
          ansible_host: 10.10.16.12
        hccp-prod-web-03:
          ansible_host: 10.10.16.13
        hccp-prod-app-01:
          ansible_host: 10.10.16.31
        hccp-prod-app-02:
          ansible_host: 10.10.16.32
    windows:
      vars:
        ansible_user: Administrator
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: validate
      hosts:
        hccp-prod-win-01:
          ansible_host: 10.10.16.41
