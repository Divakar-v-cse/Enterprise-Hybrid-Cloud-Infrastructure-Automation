---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create the application document root
  ansible.builtin.file:
    path: "{{ webapp_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webapp_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy the health probe
  ansible.builtin.copy:
    content: "ok\n"
    dest: "{{ webapp_root }}/healthz"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the nginx virtual host
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/hccp.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Remove the default nginx server block
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Confirm the health endpoint responds locally
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    status_code: 200
    return_content: true
  register: health_probe
  retries: 5
  delay: 3
  until: health_probe.status == 200
  changed_when: false
