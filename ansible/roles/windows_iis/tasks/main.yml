---
- name: Install IIS and management features
  ansible.windows.win_feature:
    name:
      - Web-Server
      - Web-WebSockets
      - Web-Mgmt-Tools
      - Web-Filtering
      - Web-Http-Logging
    state: present
    include_management_tools: true
  register: iis_feature

- name: Reboot after installing IIS when required
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: iis_feature.reboot_required | default(false)

- name: Create the site directory
  ansible.windows.win_file:
    path: "{{ iis_physical_path }}"
    type: directory

- name: Deploy the site landing page
  ansible.windows.win_template:
    src: index.html.j2
    dest: "{{ iis_physical_path }}\\index.html"

- name: Deploy the health probe
  ansible.windows.win_copy:
    content: "ok"
    dest: "{{ iis_physical_path }}\\health.txt"

- name: Create the application pool
  community.windows.win_iis_webapppool:
    name: "{{ iis_app_pool }}"
    state: started
    attributes:
      managedRuntimeVersion: ""
      managedPipelineMode: Integrated
      processModel.identityType: "{{ iis_app_pool_identity }}"
      recycling.periodicRestart.time: "00:00:00"

- name: Create the website and binding
  community.windows.win_iis_website:
    name: "{{ iis_site_name }}"
    state: started
    port: "{{ iis_binding_port }}"
    ip: "*"
    hostname: ""
    physical_path: "{{ iis_physical_path }}"
    application_pool: "{{ iis_app_pool }}"
    parameters:
      logfile.directory: C:\inetpub\logs\LogFiles

- name: Disable directory browsing
  ansible.windows.win_shell: |
    & "$env:SystemRoot\System32\inetsrv\appcmd.exe" set config "{{ iis_site_name }}" /section:directoryBrowse /enabled:false
  register: directory_browse
  changed_when: "'Applied configuration changes' in directory_browse.stdout"
  failed_when: false

- name: Remove the server banner from responses
  ansible.windows.win_shell: |
    & "$env:SystemRoot\System32\inetsrv\appcmd.exe" set config /section:httpProtocol /customHeaders.[name='X-Powered-By'].value:""
  register: banner_removal
  changed_when: "'Applied configuration changes' in banner_removal.stdout"
  failed_when: false

- name: Harden the TLS stack
  ansible.builtin.include_tasks: tls.yml
  tags: [tls, hardening]

- name: Ensure the IIS service is running
  ansible.windows.win_service:
    name: W3SVC
    state: started
    start_mode: auto
