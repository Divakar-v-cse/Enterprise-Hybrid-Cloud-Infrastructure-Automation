---
# Disable legacy protocols at the SCHANNEL level (server and client).
- name: Disable legacy TLS protocols
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\{{ item.protocol }}\{{ item.side }}'
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
    state: present
  loop: >-
    {{
      [
        {'protocol': 'SSL 2.0', 'side': 'Server', 'name': 'Enabled', 'data': 0},
        {'protocol': 'SSL 2.0', 'side': 'Server', 'name': 'DisabledByDefault', 'data': 1},
        {'protocol': 'SSL 3.0', 'side': 'Server', 'name': 'Enabled', 'data': 0},
        {'protocol': 'SSL 3.0', 'side': 'Server', 'name': 'DisabledByDefault', 'data': 1},
        {'protocol': 'TLS 1.0', 'side': 'Server', 'name': 'Enabled', 'data': 0},
        {'protocol': 'TLS 1.0', 'side': 'Server', 'name': 'DisabledByDefault', 'data': 1},
        {'protocol': 'TLS 1.1', 'side': 'Server', 'name': 'Enabled', 'data': 0},
        {'protocol': 'TLS 1.1', 'side': 'Server', 'name': 'DisabledByDefault', 'data': 1}
      ]
    }}
  loop_control:
    label: "{{ item.protocol }} / {{ item.name }}"
  when: windows_disable_tls_10 | default(true) | bool
  notify: Restart W3SVC

- name: Enable TLS 1.2 explicitly
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server'
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
    state: present
  loop:
    - { name: Enabled, data: 1 }
    - { name: DisabledByDefault, data: 0 }
  loop_control:
    label: "{{ item.name }}"
  notify: Restart W3SVC

- name: Remove weak cipher suites from the policy
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
    name: Functions
    data: >-
      TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,
      TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    type: string
    state: present
  notify: Restart W3SVC
