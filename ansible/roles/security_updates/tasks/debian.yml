---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: Enable the periodic upgrade job
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Scope unattended upgrades to the security archive
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades is running
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Apply pending security updates now
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
  when: patch_now | default(false) | bool
  register: apt_upgrade
  retries: 2
  delay: 10
  until: apt_upgrade is not failed
