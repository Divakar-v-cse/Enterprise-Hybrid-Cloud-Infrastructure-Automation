---
- name: Ensure the sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hccp.conf
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f /etc/ssh/sshd_config"
  notify: Restart sshd
