---
- name: Restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
